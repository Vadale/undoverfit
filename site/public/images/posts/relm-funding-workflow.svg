<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">From six notices to a reviewable CSV with relm</title>
  <desc id="desc">Six synthetic funding notices are processed locally in R. Six amount fields match the expected values, but only five amount-and-quotation pairs match. The incorrect quotation is kept for human review. This is one recorded run, not an accuracy benchmark.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8e9aa8" opacity=".17"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#5dd3c1" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="780" rx="24" fill="#0e1a26"/>
  <rect width="1200" height="780" rx="24" fill="url(#dots)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="62" y="66" fill="#5dd3c1" font-size="17" letter-spacing="3">RELM / A RECORDED EXAMPLE</text>
    <text x="62" y="126" fill="#ede7d8" font-size="44" font-weight="600">From notices to data you can check.</text>
    <text x="62" y="167" fill="#b2bdc8" font-size="21">Local inference in R. The results—and the mistake—stay visible.</text>

    <rect x="62" y="216" width="302" height="177" rx="14" fill="#152b3c" stroke="#365166"/>
    <text x="86" y="252" fill="#5dd3c1" font-size="15" letter-spacing="2">01 / INPUT</text>
    <text x="86" y="291" fill="#ede7d8" font-size="25" font-weight="600">6 synthetic notices</text>
    <text x="86" y="328" fill="#b2bdc8" font-size="18">Budgets, missing totals</text>
    <text x="86" y="355" fill="#b2bdc8" font-size="18">and distracting numbers.</text>

    <path d="M375 304h28" fill="none" stroke="#5dd3c1" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="416" y="216" width="330" height="177" rx="14" fill="#12363c" stroke="#5dd3c1"/>
    <text x="440" y="252" fill="#5dd3c1" font-size="15" letter-spacing="2">02 / LOCAL MODEL + R</text>
    <text x="440" y="291" fill="#ede7d8" font-size="25" font-weight="600">Extract two fields</text>
    <text x="440" y="328" fill="#c3d4d6" font-size="18">Total programme budget</text>
    <text x="440" y="355" fill="#c3d4d6" font-size="18">and a supporting quotation.</text>

    <path d="M757 304h28" fill="none" stroke="#5dd3c1" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="798" y="216" width="340" height="177" rx="14" fill="#152b3c" stroke="#365166"/>
    <text x="822" y="252" fill="#5dd3c1" font-size="15" letter-spacing="2">03 / CSV FOR REVIEW</text>
    <text x="822" y="291" fill="#ede7d8" font-size="25" font-weight="600">Keep every answer</text>
    <text x="822" y="328" fill="#b2bdc8" font-size="18">Compare with the source.</text>
    <text x="822" y="355" fill="#b2bdc8" font-size="18">Inspect the failed quotation.</text>

    <rect x="62" y="429" width="1076" height="118" rx="14" fill="#132837" stroke="#365166"/>
    <text x="89" y="467" fill="#b2bdc8" font-size="16" letter-spacing="1.5">THIS RUN</text>
    <text x="89" y="511" fill="#5dd3c1" font-size="35" font-weight="600">6/6</text>
    <text x="173" y="509" fill="#ede7d8" font-size="21">amount fields match</text>
    <line x1="528" y1="457" x2="528" y2="524" stroke="#365166"/>
    <text x="568" y="511" fill="#edbb7c" font-size="35" font-weight="600">5/6</text>
    <text x="652" y="509" fill="#ede7d8" font-size="21">amount + quotation pairs match</text>

    <text x="62" y="592" fill="#edbb7c" font-size="19">HARBOUR: a per-project cap was quoted even though no total was stated.</text>
    <text x="62" y="628" fill="#b2bdc8" font-size="18">Missing totals count as matching amount fields when correctly returned as null.</text>
    <text x="62" y="659" fill="#b2bdc8" font-size="18">One synthetic example, recorded 23 October 2026. Human review remains necessary.</text>
    <line x1="62" y1="697" x2="1138" y2="697" stroke="#365166"/>
    <text x="62" y="741" fill="#ede7d8" font-family="Georgia, serif" font-size="26">Und<tspan fill="#5dd3c1" font-style="italic">over</tspan>fit</text>
    <text x="1138" y="738" fill="#b2bdc8" font-size="16" text-anchor="end">RELM 0.6.1 / QWEN2.5 1.5B / CPU</text>
  </g>
</svg>
