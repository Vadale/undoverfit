[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Giscus loads these stylesheets from its own iframe with crossorigin="anonymous".
[[headers]]
  for = "/giscus-theme-light.css"
  [headers.values]
    Access-Control-Allow-Origin = "https://giscus.app"

[[headers]]
  for = "/giscus-theme-dark.css"
  [headers.values]
    Access-Control-Allow-Origin = "https://giscus.app"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
